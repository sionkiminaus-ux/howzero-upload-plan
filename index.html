<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>howzero 이번 주 릴스</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@500&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
/* Layout: OpenFunnel 틀 — 양옆 세로선 프레임. 위 = 이번 주 7칸 캘린더, 아래 = 올린 영상 지표(요약 4칸 + 표) */
:root{
  --bg:#020202; --fg:#fafafa; --card:#0b0b0b; --muted:#161616; --muted-fg:#a3a3a3; --border:#292929;
  --primary:#2563eb; --primary-soft:#0f1d3d; --ok:#4ade80; --ok-soft:#0e2a19;
  --sans:Geist,"Pretendard Variable",Pretendard,-apple-system,"Apple SD Gothic Neo",system-ui,sans-serif;
  --mono:"Geist Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;word-break:keep-all;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid #93c5fd;outline-offset:2px;border-radius:6px}
.frame{max-width:1160px;margin:0 auto;border-left:1px solid var(--border);border-right:1px solid var(--border);min-height:100dvh}
nav{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 20px;border-bottom:1px solid var(--border)}
.wordmark{display:inline-flex;align-items:center;gap:10px;font-weight:700;letter-spacing:.18em;font-size:15px}
.mark{width:26px;height:26px;border-radius:7px;background:#a9a6a0;color:#020202;display:grid;place-items:center;font-size:12px;letter-spacing:0}
.btn{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:8px;font-size:13px;font-weight:500;background:var(--primary);color:#fff;white-space:nowrap}
.sec{padding:40px 32px;border-bottom:1px solid var(--border)}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:20px}
h1,h2{margin:0;letter-spacing:-.02em;text-wrap:balance}
h1{font-size:clamp(26px,3.4vw,34px);font-weight:600}
h2{font-size:22px;font-weight:600}
.sub{color:var(--muted-fg);font-size:14px;margin:6px 0 0}
.legend{display:flex;gap:12px;font-size:12.5px;color:var(--muted-fg)}
.legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:1px}

/* 캘린더 */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border:1px solid var(--border);border-radius:14px;overflow:hidden}
.day{border-right:1px solid var(--border);min-height:230px;display:flex;flex-direction:column;min-width:0}
.day:last-child{border-right:0}
.dh{display:flex;justify-content:space-between;align-items:baseline;padding:10px 12px;border-bottom:1px solid var(--border);background:var(--card)}
.dh .w{font-size:12.5px;color:var(--muted-fg)}
.dh .n{font-family:var(--mono);font-size:15px;font-variant-numeric:tabular-nums}
.day.today .dh{background:var(--primary-soft)}
.day.today .dh .n{color:#fff}
.day.today .dh .w::after{content:" · 오늘";color:#93c5fd}
.dbody{padding:10px;flex:1;display:flex}
.ev{flex:1;display:flex;flex-direction:column;gap:8px;border:1px solid var(--border);border-radius:10px;padding:10px;background:var(--card);min-width:0}
.ev.posted{border-color:#1f4d31}
.ev.today{border-color:var(--primary);box-shadow:0 0 0 3px rgba(37,99,235,.18)}
.st{align-self:flex-start;font-size:11px;font-weight:600;border-radius:999px;padding:1px 8px}
.st.posted{color:var(--ok);background:var(--ok-soft)}
.st.today{color:#fff;background:var(--primary)}
.st.plan{color:var(--muted-fg);background:var(--muted);border:1px solid var(--border)}
.ep{font-family:var(--mono);font-size:12px;color:var(--muted-fg)}
.tt{font-size:13.5px;font-weight:600;line-height:1.4}
.ev .stat{font-size:12px;color:var(--muted-fg);font-variant-numeric:tabular-nums}
.ev .stat b{color:var(--fg);font-weight:600}
.ev a.go{margin-top:auto;font-size:12.5px;font-weight:500;color:#93c5fd}
.ev a.go:hover{text-decoration:underline;text-underline-offset:3px}
.empty{flex:1;display:grid;place-items:center;border:1px dashed var(--border);border-radius:10px;color:#5a5a5a;font-size:12.5px}

/* 지표 */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:16px}
.kpi{border:1px solid var(--border);border-radius:12px;padding:14px 16px;background:var(--card)}
.kpi span{font-size:12.5px;color:var(--muted-fg)}
.kpi b{display:block;font-size:26px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.01em;margin-top:2px}
.tablebox{overflow-x:auto;border:1px solid var(--border);border-radius:12px}
table{border-collapse:collapse;width:100%;min-width:640px;font-size:14px}
th,td{padding:11px 14px;border-bottom:1px solid var(--border);text-align:left;white-space:nowrap}
th{font-size:12px;font-weight:500;color:var(--muted-fg);background:var(--card)}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
td.mono{font-family:var(--mono);font-size:12.5px;color:var(--muted-fg)}
td.title{white-space:normal;min-width:220px}
td.title a:hover{text-decoration:underline;text-underline-offset:3px}
.vbar{display:flex;align-items:center;gap:10px;justify-content:flex-end}
.vbar i{display:block;height:6px;border-radius:3px;background:var(--primary)}
.best{font-size:11px;font-weight:600;color:var(--ok);background:var(--ok-soft);border-radius:999px;padding:1px 7px;margin-left:6px}
.foot{font-size:12.5px;color:var(--muted-fg);margin:12px 0 0}
footer{padding:22px 32px;font-size:12.5px;color:var(--muted-fg)}

@media (max-width:860px){
  .cal{grid-template-columns:1fr}
  .day{border-right:0;border-bottom:1px solid var(--border);min-height:0;flex-direction:row}
  .day:last-child{border-bottom:0}
  .dh{flex-direction:column;justify-content:flex-start;gap:2px;width:78px;flex:none;border-bottom:0;border-right:1px solid var(--border)}
  .day.today .dh .w::after{content:""}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:560px){ .sec{padding:28px 14px} nav{padding:12px 14px} footer{padding:20px 14px} }
</style>
</head>
<body>
<div class="frame">
  <nav>
    <span class="wordmark"><span class="mark" aria-hidden="true">hz</span>HOWZERO</span>
    <a class="btn" href="https://www.instagram.com/howzero__/reels/" target="_blank" rel="noopener">인스타 릴스 열기</a>
  </nav>

  <section class="sec">
    <div class="head">
      <div><h1>이번 주 릴스</h1><p class="sub">11/02(월) ~ 11/08(일) · 하루 한 편</p></div>
      <div class="legend"><span><i style="background:var(--ok)"></i>게시됨</span><span><i style="background:var(--primary)"></i>오늘</span><span><i style="background:#555"></i>예정</span></div>
    </div>
    <div class="cal" id="cal"></div>
  </section>

  <section class="sec">
    <div class="head">
      <div><h2>올린 영상 지표</h2><p class="sub">10/28부터 올린 5편 · 11/03 오전 10시 40분 기준</p></div>
    </div>
    <div class="kpis" id="kpis"></div>
    <div class="tablebox"><table>
      <thead><tr><th>게시일</th><th>편</th><th>제목</th><th class="num">조회</th><th class="num">댓글</th><th class="num">참여율</th></tr></thead>
      <tbody id="rows"></tbody>
    </table></div>
    <p class="foot">좋아요 수는 비공개로 설정된 게시물이 많아 뺐어요. 10편은 올린 지 하루가 안 돼서 더 오를 거예요.</p>
  </section>

  <footer>howzero · @howzero__ · 2026-11-03 기준</footer>
</div>
<script>
const TODAY = '11/03';
const WEEK = [
  {w:'월',d:'11/02',ep:'10',t:'클로드 초보라면 꼭 깔아야 할 무료 플러그인 5개',posted:true,url:'https://www.instagram.com/reel/DfPDXh4oPrI/'},
  {w:'화',d:'11/03',ep:'13',t:'클로드 하는 말 그냥 믿으면 망합니다',url:'https://drive.google.com/file/d/1A1zmTNMTrO5P2ePwt139ljaac_iTTRnL/view'},
  {w:'수',d:'11/04',ep:'14',t:'클로드 초기 세팅법, 왕초보 4단계',url:'https://drive.google.com/file/d/12AWMy5rV2HzRBLvwJ1mi6HjLSGooCGCe/view'},
  {w:'목',d:'11/05',ep:'09',t:'한도 걸려도 제발 결제하지 마세요',url:'https://drive.google.com/file/d/12CKx4qJrLfonF2a2IPOeOM86_O4URnBg/view'},
  {w:'금',d:'11/06',ep:'15',t:'아직도 복붙해요? AI가 대신 눌러요',url:'https://drive.google.com/file/d/1jQQCmUa8fT2iFYBK7yUPNSlovG8CjmNp/view'},
  {w:'토',d:'11/07',ep:'11',t:'이 아이템 팔릴까? AI 손님한테 물어봄',url:'https://drive.google.com/file/d/1Nejwby8n8Xii1HOwkxqyHkKdBfAxQWC1/view'},
  {w:'일',d:'11/08'}
];
const POSTED = [
  {d:'10/28',ep:'06',t:"AI 결과물이 별로라면, '해줘'부터 쳐서 그래요",u:'https://www.instagram.com/reel/DfCLEJ-IuT8/',v:1777,c:7,er:0.4},
  {d:'10/29',ep:'05',t:'메타가 만든 AI 앱, 8시간 만에 제 걸로',u:'https://www.instagram.com/reel/DfEvjAuIckY/',v:3673,c:27,er:0.7},
  {d:'10/30',ep:'04',t:'블로그 제발 직접 쓰지 마세요',u:'https://www.instagram.com/reel/DfHYYVhIz-P/',v:6193,c:152,er:2.5},
  {d:'10/31',ep:'08',t:'클로드한테 제발 바로 시키지 마세요',u:'https://www.instagram.com/reel/DfKBK9XIWGz/',v:296,c:2,er:0.7},
  {d:'11/02',ep:'10',t:'클로드 초보라면 꼭 깔아야 할 무료 플러그인 5개',u:'https://www.instagram.com/reel/DfPDXh4oPrI/',v:2689,c:17,er:1.0}
];
const FOLLOWERS = 169;
const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt = n => n.toLocaleString('ko-KR');

document.getElementById('cal').innerHTML = WEEK.map(x=>{
  const isToday = x.d===TODAY;
  let body;
  if(!x.ep) body = '<div class="empty">업로드 없음</div>';
  else if(x.posted){
    const p = POSTED.find(p=>p.ep===x.ep);
    body = `<div class="ev posted"><span class="st posted">게시됨</span><span class="ep">${x.ep}편</span><span class="tt">${esc(x.t)}</span><span class="stat">조회 <b>${fmt(p.v)}</b> · 댓글 <b>${p.c}</b></span><a class="go" href="${x.url}" target="_blank" rel="noopener">인스타에서 보기 →</a></div>`;
  } else {
    body = `<div class="ev${isToday?' today':''}"><span class="st ${isToday?'today':'plan'}">${isToday?'오늘 업로드':'예정'}</span><span class="ep">${x.ep}편</span><span class="tt">${esc(x.t)}</span><a class="go" href="${x.url}" target="_blank" rel="noopener">▶ 영상 보기</a></div>`;
  }
  return `<div class="day${isToday?' today':''}"><div class="dh"><span class="w">${x.w}</span><span class="n">${x.d}</span></div><div class="dbody">${body}</div></div>`;
}).join('');

const total = POSTED.reduce((a,p)=>a+p.v,0), comments = POSTED.reduce((a,p)=>a+p.c,0);
document.getElementById('kpis').innerHTML = [
  ['총 조회', fmt(total)], ['편당 평균 조회', fmt(Math.round(total/POSTED.length))], ['총 댓글', fmt(comments)], ['팔로워', fmt(FOLLOWERS)]
].map(([k,v])=>`<div class="kpi"><span>${k}</span><b>${v}</b></div>`).join('');

const max = Math.max(...POSTED.map(p=>p.v));
document.getElementById('rows').innerHTML = POSTED.map(p=>`<tr><td class="mono">${p.d}</td><td class="mono">${p.ep}</td><td class="title"><a href="${p.u}" target="_blank" rel="noopener">${esc(p.t)}</a>${p.v===max?'<span class="best">최고</span>':''}</td><td class="num"><span class="vbar"><i style="width:${Math.max(3,Math.round(p.v/max*90))}px"></i>${fmt(p.v)}</span></td><td class="num">${p.c}</td><td class="num">${p.er.toFixed(1)}%</td></tr>`).join('');
</script>
</body>
</html>
